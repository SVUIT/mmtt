---
name: Weekly Dead Link Checker

'on':
  push:
    branches:
      - VietHoang
    paths:
      - '.github/workflows/check-links.yml'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prepare reports
        run: mkdir -p reports

      - name: Install LinkChecker
        run: >-
          python -m pip install 'linkchecker==10.6.0'
          2>&1 | tee reports/install.log

      - name: Find sitemap
        run: |
          python - <<'PY' > reports/sitemap.log 2>&1
          from pathlib import Path
          from urllib.request import urlopen
          import xml.etree.ElementTree as ET

          sitemap = 'https://svuit.org/mmtt/sitemap.xml'
          try:
              with urlopen(sitemap, timeout=30) as response:
                  root = ET.fromstring(response.read())
              tag = root.tag.rsplit('}', 1)[-1]
              if tag not in {'urlset', 'sitemapindex'}:
                  raise ValueError('Response is not a sitemap')
              Path('reports/sitemap-url.txt').write_text(sitemap + '\n')
              print('Using sitemap:', sitemap)
          except Exception as error:
              print('Sitemap unavailable:', error)
              print('Crawling pages reachable from /mmtt/ only.')
          PY

      - name: Check website links
        shell: bash
        run: |
          targets=('https://svuit.org/mmtt/')
          if [[ -f reports/sitemap-url.txt ]]; then
            targets+=("$(cat reports/sitemap-url.txt)")
          fi

          set +e
          timeout --signal=INT --kill-after=30s 45m \
            linkchecker \
            --check-extern \
            --no-follow-url='!^https?://svuit\.org/mmtt(?:/|$)' \
            --threads=5 \
            --timeout=30 \
            --no-status \
            --file-output=html/utf-8/reports/dead-links.html \
            --file-output=csv/utf-8/reports/dead-links.csv \
            "${targets[@]}" 2>&1 | tee reports/check-links.log
          result=${PIPESTATUS[0]}
          echo "$result" > reports/exit-code.txt
          exit "$result"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dead-links-log
          path: reports/
          retention-days: 14
          if-no-files-found: error
