---
name: Weekly Dead Link Checker

'on':
  push:
    branches:
      - VietHoang
    paths:
      - '.github/workflows/check-links.yml'
      - 'docs/**/*.md'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --scheme http
            --scheme https
            --timeout 30
            --max-retries 2
            --max-concurrency 5
            './docs/**/*.md'
          fail: false
          failIfEmpty: true
          format: markdown
          output: dead-links-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dead-links-log
          path: dead-links-report.md
          retention-days: 14
          if-no-files-found: error
